<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Ongkir</title>
  <style>
    /* ── RESET & BASE ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080c14;
      --surface:   #0e1420;
      --card:      #131b2e;
      --border:    rgba(99,132,220,.18);
      --accent:    #4f8ef7;
      --accent2:   #7dd3fc;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --success:   #34d399;
      --radius:    18px;
      --font:      'Segoe UI', 'SF Pro Display', system-ui, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      /* subtle grid background */
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(79,142,247,.15), transparent),
        linear-gradient(rgba(99,132,220,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,132,220,.04) 1px, transparent 1px);
      background-size: auto, 40px 40px, 40px 40px;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
      width: 100%;
      max-width: 460px;
      box-shadow:
        0 0 0 1px rgba(79,142,247,.06),
        0 24px 60px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(12px);
      animation: slideUp .45s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    .header .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 54px; height: 54px;
      background: linear-gradient(135deg, #1e3a6e, #0e1f45);
      border: 1px solid rgba(79,142,247,.3);
      border-radius: 16px;
      font-size: 26px;
      margin-bottom: 14px;
      box-shadow: 0 0 24px rgba(79,142,247,.2);
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, #e2e8f0 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--muted);
      font-size: .85rem;
      margin-top: 4px;
    }

    /* ── INPUT ── */
    .input-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .input-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
      opacity: .55;
    }

    .input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px 13px 40px;
      font-size: .95rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }

    .input::placeholder { color: var(--muted); }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79,142,247,.15);
    }

    /* ── STATUS ── */
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .8rem;
      color: var(--muted);
      min-height: 20px;
      margin-bottom: 12px;
      transition: opacity .25s;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background .3s;
    }

    .status.ready .dot  { background: var(--success); box-shadow: 0 0 6px var(--success); }
    .status.loading .dot { background: var(--accent); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }

    /* ── RESULT ── */
    .result {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: none;
      animation: fadeIn .3s ease both;
    }

    .result.visible { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--border);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }

    .result-body { padding: 18px; }

    .location-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 16px;
    }

    .location-row .loc-icon { font-size: 18px; margin-top: 2px; }

    .loc-label { font-size: .72rem; color: var(--muted); margin-bottom: 2px; }
    .loc-value { font-size: .95rem; font-weight: 600; line-height: 1.4; }

    .price-box {
      background: linear-gradient(135deg, rgba(79,142,247,.12), rgba(125,211,252,.08));
      border: 1px solid rgba(79,142,247,.25);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price-label { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }

    .price-value {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .price-icon { font-size: 28px; opacity: .7; }

    .result-empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    .result-empty span { font-size: 28px; display: block; margin-bottom: 8px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .card { padding: 26px 20px; }
      .price-value { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="header">
    <div class="icon">🚚</div>
    <h1>Cek Ongkir</h1>
    <p>Temukan biaya pengiriman ke lokasimu</p>
  </div>

  <div class="input-wrap">
    <span class="input-icon">📍</span>
    <input
      class="input"
      id="search"
      type="text"
      placeholder="Ketik kota, kecamatan, atau desa..."
      autocomplete="off"
    >
  </div>

  <div class="status loading" id="status">
    <div class="dot"></div>
    <span id="status-text">Memuat data...</span>
  </div>

  <div class="result" id="result"></div>

</div>

<script>
  let data = [];

  const statusEl     = document.getElementById('status');
  const statusText   = document.getElementById('status-text');
  const resultEl     = document.getElementById('result');
  const searchEl     = document.getElementById('search');

  function setStatus(state, text) {
    statusEl.className = 'status ' + state;
    statusText.textContent = text;
  }

  async function loadData() {
    try {
      const res = await fetch('data.json');
      const raw = await res.json();

      data = raw.map(item => {
        const lokasi = item['KABUPATEN/KECAMATAN'] || '';
        const parts  = lokasi.split(',').map(x => x.trim());
        return {
          full      : lokasi.toLowerCase(),
          kota      : parts[0] || '',
          kecamatan : parts[1] || '',
          desa      : parts[2] || '',
          ongkir    : parseInt(item['ONGKIR']) || 0
        };
      });

      setStatus('ready', 'Siap — ' + data.length + ' wilayah tersedia');
    } catch {
      setStatus('', 'Gagal memuat data');
    }
  }

  function renderResult(found) {
    if (!found) {
      resultEl.innerHTML = `
        <div class="result-empty">
          <span>🔍</span>
          Wilayah tidak ditemukan. Coba kata kunci lain.
        </div>`;
    } else {
      const lokasi = [found.kota, found.kecamatan, found.desa].filter(Boolean).join(' › ');
      resultEl.innerHTML = `
        <div class="result-header">Hasil Pencarian</div>
        <div class="result-body">
          <div class="location-row">
            <span class="loc-icon">🗺️</span>
            <div>
              <div class="loc-label">Wilayah</div>
              <div class="loc-value">${lokasi}</div>
            </div>
          </div>
          <div class="price-box">
            <div>
              <div class="price-label">Ongkos Kirim</div>
              <div class="price-value">Rp ${found.ongkir.toLocaleString('id-ID')}</div>
            </div>
            <span class="price-icon">📦</span>
          </div>
        </div>`;
    }

    resultEl.className = 'result';
    // Trigger reflow to restart animation
    void resultEl.offsetWidth;
    resultEl.className = 'result visible';
  }

  function searchData(keyword) {
    keyword = keyword.toLowerCase();
    const found = data.find(d => d.full.includes(keyword));
    renderResult(found || null);
  }

  searchEl.addEventListener('input', function () {
    if (this.value.length > 2) {
      searchData(this.value);
    } else {
      resultEl.className = 'result';
    }
  });

  loadData();
</script>

</body>
</html>
